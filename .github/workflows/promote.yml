name: Přepnutí sandboxu na schválený návrh

# Když rádio (Dashboard_Peugeot_407) vydá verzi z návrhu v navrh/, přesune se návrh do kořene sandboxu.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kontrola vydání rádia
        id: chk
        run: |
          if [ ! -f navrh/proposal.json ]; then echo "Žádný návrh."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          PV=$(jq -r .version navrh/proposal.json)
          # Verze rádia = nejvyšší tag vX.Y(.Z) v repu rádia (spolehlivější než API releases/latest)
          TAG=$(git ls-remote --tags --refs https://github.com/panKubaHunana/Dashboard_Peugeot_407.git \
            | sed 's#.*refs/tags/##' | grep -E '^v?[0-9]+(\.[0-9]+)*$' | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsS https://api.github.com/repos/panKubaHunana/Dashboard_Peugeot_407/releases/latest | jq -r .tag_name | sed 's/^v//')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then echo "::error::Nepodařilo se zjistit verzi rádia."; exit 1; fi
          echo "Návrh $PV, rádio $TAG"
          # Přesun, až je rádio stejné nebo novější než návrh (3.0.1 čeká na tag 3.0.1, 3.0 stačí tag 3.0)
          if [ "$(printf '%s\n%s\n' "$PV" "$TAG" | sort -V | tail -1)" = "$TAG" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; echo "ver=$PV" >> "$GITHUB_OUTPUT"; else echo "go=no" >> "$GITHUB_OUTPUT"; fi
      - name: Přesun návrhu do sandboxu
        if: steps.chk.outputs.go == 'yes'
        env:
          VER: ${{ steps.chk.outputs.ver }}
        run: |
          rsync -a --exclude proposal.json --exclude index.html navrh/ ./
          rm -rf navrh
          sed -i "s#const CACHE = '[^']*'#const CACHE = 'sbx407-$VER-b1'#" sw.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sandbox $VER – schválený návrh je v rádiu"
          git push
      - name: Zveřejnění na GitHub Pages
        if: steps.chk.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
