name: Přepnutí sandboxu na schválený návrh

# Když rádio (Dashboard_Peugeot_407) vydá verzi z návrhu v navrh/, přesune se návrh do kořene sandboxu.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kontrola vydání rádia
        id: chk
        run: |
          if [ ! -f navrh/proposal.json ]; then echo "Žádný návrh."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          PV=$(jq -r .version navrh/proposal.json)
          TAG=$(curl -fsS https://api.github.com/repos/panKubaHunana/Dashboard_Peugeot_407/releases/latest | jq -r .tag_name | sed 's/^v//')
          mm() { echo "$1" | cut -d. -f1,2; }
          echo "Návrh $PV, rádio $TAG"
          if [ "$(mm "$TAG")" = "$(mm "$PV")" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; echo "ver=$PV" >> "$GITHUB_OUTPUT"; else echo "go=no" >> "$GITHUB_OUTPUT"; fi
      - name: Přesun návrhu do sandboxu
        if: steps.chk.outputs.go == 'yes'
        env:
          VER: ${{ steps.chk.outputs.ver }}
        run: |
          rsync -a --exclude proposal.json --exclude index.html navrh/ ./
          rm -rf navrh
          sed -i "s#const CACHE = '[^']*'#const CACHE = 'sbx407-$VER-b1'#" sw.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sandbox $VER – schválený návrh je v rádiu"
          git push
      - name: Zveřejnění na GitHub Pages
        if: steps.chk.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
